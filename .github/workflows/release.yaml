---
name: release
run-name: release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to be released'
        required: true

env:
  PROJECT_NAME: ${{ github.event.repository.name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Epic copy: refuse a non-epic tag before any image is pushed.
      - name: Refuse a tag that is not an epic tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-bnaas\.[0-9]+$ ]]; then
            echo "::error::$TAG is not an X.Y.Z-bnaas.N epic tag"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildk
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Install Oras
        run: |
          curl -L https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz | \
            tar -xz -C /usr/local/bin oras
        env:
          ORAS_VERSION: 1.2.2

      - name: Push dashboards into the production namespace
        run: |
          oras push ghcr.io/${{ github.repository }}/${{ env.PROJECT_NAME }}-dashboards:${{ github.event.inputs.tag }} \
            dashboard.json:application/grafana-dashboard+json \
            alerts.yaml:application/prometheus-alerts+yaml
        working-directory: monitoring

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: production
          tags: ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push test coverage image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: testcoverage
          tags: ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}-testcoverage
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push federation image
        uses: docker/build-push-action@v5
        with:
          push: true
          context: images/federation
          provenance: false
          build-args: CLOUDSERVER_VERSION=${{ github.event.inputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}-federation
          labels: |
            git.repository=${{ github.repository }}
            git.commit-sha=${{ github.sha }}
          cache-from: type=gha,scope=federation
          cache-to: type=gha,mode=max,scope=federation

      # Epic copy: create the tag only, with no GitHub release.
      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

  trigger-kms-release:
    runs-on: ubuntu-latest
    needs: release
    if: github.repository_owner == 'scality'
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: scality-kms
          permission-contents: read

      # Epic copy: build scality-kms here instead of starting a scality-kms
      # release, which would create a GitHub release in scality-kms. The
      # image holds the proprietary SafeNet library and this repository is
      # public, so the clone keeps no token and the build log stays quiet.
      - name: Checkout scality-kms
        id: kms-checkout
        uses: actions/checkout@v4
        with:
          repository: scality/scality-kms
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: scality-kms
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push scality-kms image
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: quiet
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          push: true
          context: scality-kms
          provenance: false
          build-args: |
            CLOUDSERVER_TAG=${{ github.event.inputs.tag }}-federation
          tags: |
            ghcr.io/${{ github.repository_owner }}/scality-kms:${{ github.event.inputs.tag }}-federation
          labels: |
            git.repository=${{ github.repository }}
            git.commit-sha=${{ github.sha }}
            scality-kms.commit-sha=${{ steps.kms-checkout.outputs.commit }}

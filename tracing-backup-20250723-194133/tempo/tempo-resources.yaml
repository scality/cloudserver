- apiVersion: v1
  data:
    hyperdrive.yaml: "# All options related to Hyperdrive.\nglobal:\n\n  # There are
      four mains modes for the hypedrive:\n  #\n  # 1. async:\n  #      It is the
      default mode, data protection is done asynchronously with\n  #      an Erasure
      Coding by Extent. In that case, nr_data will be the number of\n  #      extent
      storing data and nr_coding the parity counterpart.\n  #\n  # 2. sync:\n  #      Let
      synchronous protection with an Erasure Coding by Block.\n  #      In that case,
      nr_data will be the number of data chunk and coding the number\n  #      of
      parity chunk.\n  #\n  # 3. no-protection:\n  #      Implies no protection.\n
      \ #\n  mode: sync\n\n  # Universally unique identifier for an Hyperdrive instance.\n
      \ # Maximum length is 36.\n  uuid: \"d86bea2f-1485-4beb-a49f-3485504c9766\"\n\n
      \ # Directory path of the database.\n  dbname_path: \"/mnt/index\"\n\n  # Directory
      path of the database backup.\n  dbname_backup_path: \"/tmp/hd-index.bak\"\n\n
      \ # Defines the log level by module.\n  # Grammar: [module:level,]*default_level\n
      \ # module: http/hyperiod/common/dataland/ece/engine/erasure/\n  #         extentset/index/relocation/scrubber/worker/config\n
      \ # level: debug/info/notice/warning/error\n  # Example: dataland:info,debug\n
      \ # Example: relocation:warning,ece:error,info\n  log: \"http:info,info\"\n\n
      \ # Enable/Disable write sync (for data and index).\n  # Values: none / both
      / data / index\n  write_sync: \"both\"\n\n  # Datasync gathering period (in
      us).\n  # Use a sync for each write, else try to batch.\n  sync_period: 10\n\n
      \ # Total size used on disk by an extent (header and footer included).\n  #
      Default to 128 MiB.\n  extent_total_size: 4194304\n\n  # Number of buffer allocated
      to read data from socket\n  extent_pool_len: 0\n\n  # Should use O_DIRECT write
      access (coding, all, none)\n  extent_direct_io: none\n\n  # Number of threads
      writer in ECE(async mode) or ECB(sync mode)\n  nr_erasure_writer: 1\n\n  # Number
      of threads involve in doing IO on get/put/del\n  # this is used only in sync
      mode\n  nr_iothread: 64\n\n  # Number of location allocated at init for the
      threads.\n  # After this threshold each location will be allocated on the fly.\n
      \ nr_stats_location: 128\n\n  # Number of workers (threads) for hyperiod.\n
      \ nr_worker: 128\n\n  # Number of tasks (threads) for hyperiod.\n  nr_task:
      128\n\n  # The minimum number of extents that can be created on a disk\n  #
      so that it is not considerated as a disk full.\n  nr_minimal_extent: 10\n\n
      \ # Number of preallocated extents at init\n  # set to 0 in order to disable
      extent preallocation.\n  nr_preallocated_extent: 10\n\n  # Number of preallocated
      groups.\n  # set to 0 in order to disable group preallocation.\n  nr_preallocated_group:
      10\n\n  # If the option is set to true, the index will restore from backup at
      start.\n  # warning: obsolete option, do not use anymore.\n  repair_index: False\n\n
      \ # Percentage of used size to reach on index's disk to flag it as full for
      the\n  # put operation.\n  # fdi: full disk index\n  fdi_percent_put: 90\n\n
      \ # Percentage of used size to reach on index's disk to flag it as full for
      the\n  # put and delete operations.\n  # fdi: full disk index\n  fdi_percent:
      96\n\n  # Enable/disable debug/test HTTP routes '/debug/...'\n  # Also enable/disable
      fuzzing lookup for the syscalls\n  # and the core dump generation\n  enable_test_mode:
      false\n\n  # Enable/disable the tracer\n  # The tracer module is linked to backend
      that provided the implementation\n  # and respsects the opentracing interface.
      The current backend is `jaegertracing`.\n  enable_tracer: False\n\n  # Number
      of seconds between each index backup.\n  # default to 0 s (no backup)\n  index_backup_period:
